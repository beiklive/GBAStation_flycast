name: Build GBAStation Flycast for Nintendo Switch

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-switch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: devkitpro/devkita64:latest
    steps:
      - name: Check out Flycast source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Switch build dependencies
        shell: bash
        run: |
          dkp-pacman -S --noconfirm --needed switch-dev switch-curl

      - name: Fetch latest release switchVK SDK
        id: switchvk-release
        shell: bash
        env:
          SWITCHVK_TOKEN: ${{ secrets.SWITCHVK_READ_TOKEN }}
          SWITCHVK_VARIANT: release
        run: bash ci/fetch-switchvk.sh "$RUNNER_TEMP/switchvk-sdk-release"

      - name: Build release NRO
        shell: bash
        run: |
          chmod +x build_local.sh build_flycast_nro.sh
          bash build_local.sh --clean -j "$(nproc)"
          test -s GBAStationFlycastStub.nro
          sha256sum GBAStationFlycastStub.nro > GBAStationFlycastStub.nro.sha256

      - name: Upload Nintendo Switch build
        uses: actions/upload-artifact@v4
        with:
          name: GBAStation-Flycast-Switch-${{ github.sha }}
          path: |
            GBAStationFlycastStub.nro
            GBAStationFlycastStub.nro.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            GBAStationFlycastStub.nro
            GBAStationFlycastStub.nro.sha256
